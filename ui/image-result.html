<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WJ 生成图片</title>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <div id="error" class="error" hidden>图片结果暂时无法显示，请使用消息中的原图链接。</div>
      <section id="result" hidden>
        <div class="layout">
          <div class="main-col">
            <div class="main-stage" aria-label="当前图片">
              <img id="main-image" alt="WJ 生成图片" decoding="async" referrerpolicy="no-referrer" hidden />
              <div id="main-skeleton" class="skeleton" hidden></div>
              <div id="main-failed" class="stage-failed" hidden></div>
            </div>
            <div class="meta-row">
              <div class="meta-left">
                <strong id="model">WJ</strong>
                <span id="resolution"></span>
              </div>
              <div class="meta-right">
                <span id="stats"></span>
                <button id="open" type="button" title="打开当前原图" aria-label="打开当前原图">
                  <i data-lucide="external-link"></i>
                </button>
              </div>
            </div>
          </div>
          <div id="thumbs" class="thumbs" aria-label="缩略图" hidden></div>
        </div>
      </section>
    </main>
    <script type="module" src="/image-result.ts"></script>
  </body>
</html>
