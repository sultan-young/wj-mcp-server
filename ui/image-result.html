<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WJ 生成图片</title>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <div id="loading" class="loading">
        <div class="skeleton"></div>
        <span>WJ 正在准备图片</span>
      </div>
      <div id="error" class="error" hidden>图片结果暂时无法显示，请使用消息中的原图链接。</div>
      <section id="result" hidden>
        <div class="layout">
          <div class="main-col">
            <button id="main-stage" class="main-stage" type="button" title="点击预览大图" aria-label="点击预览大图">
              <img id="main-image" alt="WJ 生成图片" decoding="async" referrerpolicy="no-referrer" />
            </button>
            <div class="meta-row">
              <div class="meta">
                <strong id="model">WJ</strong>
                <span id="details"></span>
              </div>
              <div class="actions">
                <button id="download" type="button" title="下载当前图片" aria-label="下载当前图片">
                  <i data-lucide="download"></i>
                </button>
                <button id="open" type="button" title="打开当前原图" aria-label="打开当前原图">
                  <i data-lucide="external-link"></i>
                </button>
              </div>
            </div>
          </div>
          <aside id="thumbs" class="thumbs" hidden aria-label="图片缩略图"></aside>
        </div>
      </section>
      <div id="lightbox" class="lightbox" hidden>
        <button id="lightbox-close" class="lightbox-close" type="button" title="关闭预览" aria-label="关闭预览">×</button>
        <img id="lightbox-image" alt="大图预览" decoding="async" referrerpolicy="no-referrer" />
      </div>
    </main>
    <script type="module" src="/image-result.ts"></script>
  </body>
</html>
