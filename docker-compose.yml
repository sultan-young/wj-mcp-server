# 同机调用 wj-server 前先执行一次：docker network create wj-internal
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  wj-mcp-server:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # 覆盖 .env 里的公网地址。拆到另一台机器时设置 WJ_API_INTERNAL_BASE_URL。
      WJ_API_BASE_URL: ${WJ_API_INTERNAL_BASE_URL:-http://wj-server:5000}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:6070:6070"
    networks:
      - default
      - wj-internal

volumes:
  redis-data:

networks:
  wj-internal:
    external: true
    name: wj-internal
